<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-shell">
        <div class="box">
            <p class="eyebrow">Task DevOps</p>
            <h1>Đăng nhập</h1>
            <p class="subtitle">Tiếp tục vào dashboard quản lý task.</p>

            <input type="text" id="loginUsername" placeholder="Tên đăng nhập">
            <input type="password" id="loginPassword" placeholder="Mật khẩu">
            <button type="button" onclick="login()">Đăng nhập</button>

            <p id="loginMessage" class="message"></p>
            <a href="register.html">Chưa có tài khoản? Đăng ký</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
