<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div>
                <p class="eyebrow">DevOps Staging Demo</p>
                <h1>Dashboard quản lý task</h1>
                <p id="welcomeText" class="muted"></p>
            </div>
            <div class="hero-actions">
                <a class="ghost-link" href="../index.html">Trang chủ</a>
                <button class="secondary-button" type="button" onclick="logout()">Đăng xuất</button>
            </div>
        </section>

        <section class="grid">
            <div class="panel">
                <div class="panel-head">
                    <h2>Thông tin task</h2>
                    <button class="ghost-button" type="button" onclick="resetTaskForm()">Làm mới</button>
                </div>

                <input type="hidden" id="taskId">

                <label for="taskTitle">Tiêu đề</label>
                <input type="text" id="taskTitle" placeholder="Nhập tiêu đề task">

                <label for="taskDescription">Mô tả</label>
                <textarea id="taskDescription" rows="5" placeholder="Nhập mô tả ngắn"></textarea>

                <label for="taskStatus">Trạng thái</label>
                <select id="taskStatus">
                    <option value="todo">Todo</option>
                    <option value="doing">Doing</option>
                    <option value="done">Done</option>
                </select>

                <div class="actions">
                    <button type="button" onclick="createTask()">Tạo task</button>
                    <button class="secondary-button" type="button" onclick="updateTask()">Cập nhật</button>
                </div>

                <p id="taskMessage" class="message"></p>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2>Danh sách task</h2>
                    <button class="ghost-button" type="button" onclick="loadTasks()">Tải lại</button>
                </div>
                <div id="taskList" class="task-list"></div>
            </div>
        </section>

        <section class="insight-grid">
            <div class="panel">
                <div class="panel-head">
                    <h2>Debug runtime</h2>
                    <button class="ghost-button" type="button" onclick="loadDebugInfo()">Tải thông tin</button>
                </div>
                <div id="debugInfo" class="debug-card">
                    <p>Chưa tải thông tin runtime.</p>
                </div>
            </div>

            <div class="panel rollback-panel">
                <div class="panel-head">
                    <h2>Rollback trigger</h2>
                    <button id="secretTriggerButton" class="danger-button hidden-trigger" type="button" onclick="triggerRollbackDemo()">Kích hoạt lỗi</button>
                </div>
                <div class="status-card">
                    <p><strong>Endpoint:</strong> <code>tasks/api/trigger-failure.php</code></p>
                    <p><strong>Kết quả mong đợi:</strong> <code>HTTP 500</code></p>
                    <p id="rollbackMessage" class="message"></p>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
