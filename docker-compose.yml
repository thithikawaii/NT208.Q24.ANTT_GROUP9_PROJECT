version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: src/Dockerfile
    image: ${DOCKER_USERNAME}/complain-app:${IMAGE_TAG:-latest}
    container_name: building-app-web
    ports:
      - "${WEB_PORT:-8088}:80"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=${DB_PASS}
      - DB_NAME=login_api_demo
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - project-network

  db:
    image: mysql:latest
    container_name: building-app-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=login_api_demo
    volumes:
      - db-data:/var/lib/mysql
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - project-network

networks:
  project-network:

volumes:
  db-data:
