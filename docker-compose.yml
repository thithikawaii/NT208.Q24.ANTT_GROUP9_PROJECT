services:
  web:
    image: ${DOCKER_USERNAME}/complain-app:${IMAGE_TAG:-latest}
    container_name: building-app-web
    ports:
      - "80:80"          
    environment:
      - DB_HOST=db         
      - DB_USER=root       
      - DB_PASS=${DB_PASS}
      - DB_NAME=login_api_demo
    env_file:
      - .env
    depends_on:
      - db                
    networks:
      - project-network

  db:
    image: mysql:latest    
    container_name: building-app-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=login_api_demo                  
    volumes:
      - db-data:/var/lib/mysql
      # Map toàn bộ thư mục database vào MySQL để tự động chạy các file .sql
      - ./src/database:/docker-entrypoint-initdb.d 
    networks:
      - project-network

networks:
  project-network:         

volumes:
  db-data: